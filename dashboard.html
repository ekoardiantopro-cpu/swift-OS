<!DOCTYPE html>
<html>
<head>
<title>SwiftOS POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
<img src="assets/logo.png" class="logo-small">
<h2>SwiftOS</h2>
<button onclick="logout()">Logout</button>
</div>

<div class="layout">

<div class="left">
<input id="search" placeholder="Cari produk...">
<div id="product-list" class="grid"></div>
</div>

<div class="right">
<h3>Kasir</h3>
<div id="cart-items"></div>
<div class="total-box">Rp <span id="total">0</span></div>
<button class="btn primary" onclick="bayar()">CHARGE</button>
<button class="btn" onclick="loadReport()">Laporan</button>
<div id="report"></div>
</div>

</div>

<script type="module" src="app.js"></script>
</body>
</html>
