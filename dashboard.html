<!DOCTYPE html>
<html>
<head>
<title>SwiftOS POS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="layout">

<div class="left">
<input class="search" id="search" placeholder="Cari produk..." onkeyup="searchProduct()">
<div id="product-list" class="grid"></div>
</div>

<div class="right">

<h3>Kasir</h3>

<div id="cart-items"></div>

<div class="total-box">
<h1>Rp <span id="total">0</span></h1>
</div>

<button class="pay" onclick="bayar()">CHARGE</button>

<button onclick="startScanner()">📷 Scan</button>
<button onclick="logout()">Logout</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/quagga/dist/quagga.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
